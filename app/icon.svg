<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Favicon del panel. Es el mismo logo que el sidebar (PanelLogo): pastilla con
    el acento del panel (acento-400 → acento-600, el iris del rediseño) y el
    gráfico de línea ascendente en la tinta del canvas. Hasta v3 era verde, el
    mismo color que una ganancia: la marca es interfaz, no un resultado.

    Va como app/icon.svg para que Next lo sirva y emita el <link rel="icon">
    solo, sin tocar el layout.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9d8fff" />
      <stop offset="1" stop-color="#6f5ef0" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#g)" />
  <path
    d="M7 21.5 13.5 15l4 4L25 11.5"
    fill="none"
    stroke="#0c0b14"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path d="M19.5 11.5H25V17" fill="none" stroke="#0c0b14" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
</svg>
